workflows:
  royal-flix-apk-build:
    name: "Royal Flix APK Build"
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      android_sdk:
        - 34
        - 34.0.0
      java: 17
    cache:
      cache_paths:
        - ~/.gradle/caches
    scripts:
      - name: Locate and setup Gradle wrapper
        script: |
          # Check if gradlew is in a subfolder
          if [ ! -f gradlew ]; then
            if [ -f android/gradlew ]; then
              cd android
            elif [ -f Royal-Flix/gradlew ]; then
              cd Royal-Flix
            fi
          fi

          # If still not found, generate it dynamically
          if [ ! -f gradlew ]; then
            echo "gradlew not found, generating wrapper..."
            gradle wrapper
          fi

          chmod +x gradlew
      - name: Build Android Debug APK
        script: |
          if [ ! -f gradlew ] && [ -f android/gradlew ]; then
            cd android
          elif [ ! -f gradlew ] && [ -f Royal-Flix/gradlew ]; then
            cd Royal-Flix
          fi
          ./gradlew assembleDebug --stacktrace
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
